<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ModaMatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app container">
      <!-- Splash Screen: Branding -->
      <section
        class="screen screen--splash active"
        id="splash-screen"
        aria-labelledby="splash-title"
      >
        <div class="card">
          <h1 id="splash-title" class="brand-mark">ModaMatch</h1>
          <p class="tagline">Memotest de moda</p>
          <button id="continue-btn" class="btn" type="button">Continuar</button>
        </div>
      </section>

      <!-- Instructions Screen -->
      <section
        class="screen screen--howto is-hidden"
        id="howto-screen"
        aria-labelledby="howto-title"
      >
        <div class="card">
          <h2 id="howto-title">¿Cómo jugar?</h2>
          <ul class="instructions-list">
            <li>Tenés 45 segundos para encontrar 6 parejas.</li>
            <li>
              Hacé clic para voltear 2 cartas; si coinciden, quedan
              descubiertas.
            </li>
            <li>Una ronda por jugador. Al finalizar, se reinicia.</li>
          </ul>
          <button id="start-btn" class="btn" type="button">Empezar</button>
        </div>
      </section>

      <!-- Game Screen -->
      <section
        class="screen screen--game is-hidden"
        id="game-screen"
        aria-labelledby="game-title"
        aria-live="polite"
      >
        <header class="hud">
          <div class="hud-stats">
            <span id="timer" class="stat stat-timer">Tiempo: 00:45</span>
            <span id="pairs-counter" class="stat stat-pairs">Parejas: 0/6</span>
          </div>
        </header>
        <div
          id="card-grid"
          class="card-grid"
          role="grid"
          aria-label="Tablero de cartas ModaMatch"
        ></div>
      </section>

      <!-- Result Screen (Modal) -->
      <section
        class="screen is-hidden"
        id="result-screen"
        aria-live="assertive"
      >
        <div class="card card--result">
          <h2 id="result-title">Resultado</h2>
          <p id="result-message"></p>
          <button id="next-player-btn" class="btn" type="button">
            Siguiente jugador
          </button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
